<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    <title>To-Do-List</title>
</head>

<body>
    <h2>Suas Atividades</h2>
    <p>Hoje é: <strong id="data-atual">DATA FICA AQUI</strong></p>

    <div class="bg-body-secondary p-1 rounded-5 shadow-sm">
        <ul class="nav nav-pills" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active bg-white text-dark fw-bold rounded-4 px-4 py-2 shadow-sm"
                    id="pills-all-tab" data-bs-toggle="pill" data-bs-target="#pills-all" type="button" role="tab">
                    All
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-secondary fw-medium rounded-4 px-4 py-2" id="pills-todo-tab"
                    data-bs-toggle="pill" data-bs-target="#pills-todo" type="button" role="tab">
                    To Do
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-secondary fw-medium rounded-4 px-4 py-2" id="pills-progress-tab"
                    data-bs-toggle="pill" data-bs-target="#pills-progress" type="button" role="tab">
                    In Progress
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-secondary fw-medium rounded-4 px-4 py-2" id="pills-done-tab"
                    data-bs-toggle="pill" data-bs-target="#pills-done" type="button" role="tab">
                    Done
                </button>
            </li>
        </ul>
    </div>


  <script src="script/principal.js"></script>
    
</body>

</html>
