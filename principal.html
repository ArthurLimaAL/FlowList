<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minhas tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="principal.css">
</head>

<body>
    <div class="profile-header d-flex align-items-center gap-3 p-4 mb-4">
        <div class="position-relative flex-shrink-0">
            <img src="assents/images/IconProfile.jpg" alt="Foto de perfil" class="avatar">
        </div>
        <div class="flex-grow-1">
            <h2 class="fw-bold m-0" style="font-size:22px;">userName</h2>
            <div id="profileConcluidas" style="color: var(--muted); font-size: 14px;" class="mt-1">
                <i class="bi bi-check2-circle me-1"></i>0 tarefas concluídas
            </div>
        </div>
    </div>

    <div class="container-tasks">
        <div class="mb-4">
            <h2 class="fw-bold mb-1">Minhas tarefas</h2>
            <div id="contador" style="color: var(--muted); font-size: 14px">
                0 tarefas · 0 concluídas
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="filters d-flex gap-2">
                <button class="btn btn-filter-active" id="f-todas" onclick="setFilter('todas')">
                    Todas
                </button>
                <button class="btn btn-filter-inactive" id="f-pendentes" onclick="setFilter('pendentes')">
                    Pendentes
                </button>
                <button class="btn btn-filter-inactive" id="f-concluidas" onclick="setFilter('concluidas')">
                    Concluídas
                </button>
            </div>
            <div class="d-flex gap-2">
                <button class="btn-new" onclick="irParaCalendario()">
                    <i class="bi bi-calendar3"></i> Calendário
                </button>
                <button class="btn-new" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="openNew()">
                    <i class="bi bi-plus-lg"></i> Nova tarefa
                </button>
            </div>
        </div>

        <div class="task-card" id="taskContainer"></div>

        <div class="d-flex justify-content-center mt-4">
            <button class="btn-new" id="btn-voltar" onclick="voltar()">
                <i class="bi bi-arrow-left"></i> Voltar
            </button>
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 id="modalTitle" class="modal-title">Nova tarefa</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="duas-colunas">
                        <div class="coluna-formulario">
                            <label class="field-label" for="inputTitulo">Tarefa</label>
                            <input id="inputTitulo" class="form-control mb-3" placeholder="Ex: Estudar capítulo 4" />
                            <label class="field-label" for="inputPrioridade">Prioridade</label>
                            <select id="inputPrioridade" class="form-select">
                                <option>Alta</option>
                                <option selected>Média</option>
                                <option>Baixa</option>
                            </select>
                            <div class="nota-modal">
                                <i class="bi bi-info-circle"></i> Sem dia marcado, a tarefa fica na lista sem agendamento.
                            </div>
                        </div>

                        <div class="coluna-calendario">
                            <div class="field-label">Dia</div>
                            <div class="mini-cal">
                                <div class="mini-cabecalho">
                                    <div>
                                        <div class="mini-titulo" id="miniTitulo">—</div>
                                        <div class="mini-leitura" id="textoData">Sem dia marcado</div>
                                    </div>
                                    <div class="d-flex gap-1">
                                        <button type="button" class="mini-nav" id="miniPrev" aria-label="Mês anterior">
                                            <i class="bi bi-chevron-left"></i>
                                        </button>
                                        <button type="button" class="mini-nav" id="miniNext" aria-label="Próximo mês">
                                            <i class="bi bi-chevron-right"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="mini-semana" id="miniDiasSemana"></div>
                                <div class="mini-grade" id="miniGrade"></div>
                                <div class="mini-atalhos">
                                    <button type="button" class="chip" data-atalho="hoje">Hoje</button>
                                    <button type="button" class="chip" data-atalho="amanha">Amanhã</button>
                                    <button type="button" class="chip" data-atalho="semana">+7 dias</button>
                                    <button type="button" class="chip chip-limpar" id="miniSemData">Nenhum</button>
                                </div>
                            </div>
                            <div class="mini-legenda">
                                <span><i class="bi bi-lock-fill"></i> passado bloqueado</span>
                                <span><span class="mini-marca-legenda"></span> dia ocupado</span>
                            </div>
                        </div>
                    </div>

                    <div class="erro" id="erroTarefa"></div>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn" data-bs-dismiss="modal" style="
                background: #2a2f44;
                color: var(--text);
                border-radius: 10px;
              ">
                        Cancelar
                    </button>
                    <button class="btn px-4" onclick="saveTask()" style="
                background: var(--blue);
                color: #0f111a;
                font-weight: 600;
                border-radius: 10px;
              ">
                        Salvar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/datas.js"></script>
    <script src="script/minicalendario.js"></script>
    <script src="script/principal.js"></script>
</body>

</html>
