<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define a codificação de caracteres da página. -->
    <meta charset="UTF-8">

    <!-- Ajusta a página para diferentes tamanhos de tela. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título do aplicativo. -->
    <title>Organiza</title>

    <!-- Carrega o CSS do Bootstrap instalado no projeto. -->
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">

    <!-- Carrega os estilos personalizados do Organiza. -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Área principal da página inicial. -->
    <main class="container py-5">

        <!-- Nome do aplicativo. -->
        <h1 class="fw-bold">Organiza</h1>

        <!-- Frase de apresentação. -->
        <p class="text-secondary">
            Seu dia organizado, do seu jeito.
        </p>

        <!-- Cartão principal de boas-vindas. -->
        <section class="card shadow-sm border-0 rounded-4 p-4 mt-4">

            <!-- Título de boas-vindas. -->
            <h2 class="h4">Bem-vinda ao seu espaço!</h2>

            <!-- Apresentação do aplicativo. -->
            <p class="mb-0">
                Em breve, você poderá organizar suas tarefas e acompanhar
                seus compromissos por aqui.
            </p>

            <!-- Área que mostrará um resumo das tarefas. -->
            <div class="row mt-4">

                <!-- Primeiro cartão: tarefas de hoje. -->
                <div class="col-md-6 mb-3">
                    <div class="card border-0 p-3 h-100">

                        <!-- Título do resumo. -->
                        <h2 class="h5">Tarefas de hoje</h2>

                        <!-- Mensagem inicial do resumo. -->
                        <p class="mb-0">
                            Você ainda vai organizar suas tarefas.
                        </p>

                    </div>
                </div>

                <!-- Segundo cartão: tarefas concluídas. -->
                <div class="col-md-6 mb-3">
                    <div class="card border-0 p-3 h-100">

                        <!-- Título do resumo. -->
                        <h2 class="h5">Tarefas concluídas</h2>

                        <!-- Mensagem inicial do resumo. -->
                        <p class="mb-0">
                            Suas conquistas aparecerão aqui.
                        </p>

                    </div>
                </div>

            </div>

            <!-- Botão que leva à tela de tarefas. -->
            <button type="button" class="btn btn-primary mt-3" onclick="window.location.href='tarefas.html'">
                Ver minhas tarefas
            </button>

        </section>

    </main>
</body>

</html>
