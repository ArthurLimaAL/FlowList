<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>To-Do-List</title>
</head>

<body class="p-4">
    <div class="container" style="max-width: 600px;">
        <h2 class="mb-3">Suas Atividades</h2>
        <p class="mb-4">Hoje é: <strong id="data-atual">CARREGANDO...</strong></p>

        <!-- Input para adicionar tarefa -->
        <div class="input-group mb-4">
            <input type="text" class="form-control form-control-lg" id="input-tarefa"
                placeholder="Adicionar nova tarefa..." aria-label="Nova tarefa">
            <button class="btn btn-primary" type="button" id="btn-adicionar">
                <i class="bi bi-plus-lg"></i> Adicionar
            </button>
        </div>

        <!-- Tabs -->
        <div class="bg-body-secondary p-1 rounded-5 shadow-sm mb-4">
            <ul class="nav nav-pills" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active bg-white text-dark fw-bold rounded-4 px-4 py-2 shadow-sm"
                        id="pills-all-tab" data-bs-toggle="pill" data-bs-target="#pills-all" type="button" role="tab">
                        All <span class="badge bg-secondary ms-1" id="count-all">0</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-secondary fw-medium rounded-4 px-4 py-2" id="pills-todo-tab"
                        data-bs-toggle="pill" data-bs-target="#pills-todo" type="button" role="tab">
                        To Do <span class="badge bg-secondary ms-1" id="count-todo">0</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-secondary fw-medium rounded-4 px-4 py-2" id="pills-done-tab"
                        data-bs-toggle="pill" data-bs-target="#pills-done" type="button" role="tab">
                        Done <span class="badge bg-secondary ms-1" id="count-done">0</span>
                    </button>
                </li>
            </ul>
        </div>

        <!-- Conteúdo das Tabs -->
        <div class="tab-content" id="pills-tabContent">
            <!-- All Tasks -->
            <div class="tab-pane fade show active" id="pills-all" role="tabpanel">
                <div id="lista-all" class="list-group">
                    <!-- Tarefas serão inseridas aqui -->
                </div>
            </div>

            <!-- To Do -->
            <div class="tab-pane fade" id="pills-todo" role="tabpanel">
                <div id="lista-todo" class="list-group">
                    <!-- Tarefas pendentes serão inseridas aqui -->
                </div>
            </div>

            <!-- Done -->
            <div class="tab-pane fade" id="pills-done" role="tabpanel">
                <div id="lista-done" class="list-group">
                    <!-- Tarefas concluídas serão inseridas aqui -->
                </div>
            </div>
        </div>

        <!-- Mensagem quando não há tarefas -->
        <div id="mensagem-vazia" class="text-center text-muted mt-5">
            <i class="bi bi-clipboard-check fs-1"></i>
            <p class="mt-2">Nenhuma tarefa encontrada</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-pprnPb08S9K8kPb08S9K8kPb08S9K8kPb08S9K8kPb08S9K8kPb08S9K8kPb08S9K8kPb"
        crossorigin="anonymous"></script>
    <script src="script/principal.js"></script>
</body>

</html>
