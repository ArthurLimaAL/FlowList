<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowList - Minhas tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="principal.css">
</head>

<body>
    <div class="app-layout">
        <!-- BARRA LATERAL (PERFIL E CALENDÁRIO) -->
        <aside class="sidebar">
            <!-- SEÇÃO DE PERFIL -->
            <div class="sidebar-profile">
                <div class="profile-avatar-wrapper">
                    <img src="assents/images/IconProfile.jpg" alt="Foto de perfil" class="sidebar-avatar">
                </div>
                <div class="profile-info">
                    <h3 class="profile-name">userName</h3>
                    <div id="profileConcluidas" class="profile-stat">
                        <i class="bi bi-check2-circle me-1"></i>0 tarefas concluídas
                    </div>
                </div>
            </div>

            <!-- SEÇÃO DO CALENDÁRIO NA BARRA LATERAL -->
            <div class="sidebar-calendar">
                <div class="side-cal-card">
                    <div class="side-cal-head">
                        <div class="side-cal-title" id="sideCalTitulo">—</div>
                        <div class="d-flex gap-1 align-items-center">
                            <button type="button" class="side-nav-btn" id="sideCalHoje" title="Ir para hoje">Hoje</button>
                            <button type="button" class="side-nav-btn icon" id="sideCalPrev" title="Mês anterior">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                            <button type="button" class="side-nav-btn icon" id="sideCalNext" title="Próximo mês">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <div class="side-cal-weekdays" id="sideCalDiasSemana"></div>
                    <div class="side-cal-grid" id="sideCalGrade"></div>

                    <div class="side-cal-legend">
                        <span><i class="dot dot-alta"></i> Alta</span>
                        <span><i class="dot dot-media"></i> Média</span>
                        <span><i class="dot dot-baixa"></i> Baixa</span>
                        <span><i class="dot dot-feito"></i> Feita</span>
                    </div>

                    <div class="side-cal-footer-actions">
                        <button type="button" class="btn-side-shortcut" id="btnSideVerTodas" onclick="limparFiltroData()">
                            <i class="bi bi-list-task"></i> Ver todas as tarefas
                        </button>
                    </div>
                </div>
            </div>

            <!-- FOOTER DA BARRA LATERAL -->
            <div class="sidebar-bottom">
                <button class="btn-sidebar-voltar" id="btn-voltar" onclick="voltar()">
                    <i class="bi bi-box-arrow-left"></i> Voltar ao início
                </button>
            </div>
        </aside>

        <!-- PARTE PRINCIPAL DA TELA (SOMENTE PARA AS TAREFAS) -->
        <main class="main-content">
            <div class="tasks-wrapper">
                <!-- CABEÇALHO DAS TAREFAS -->
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                    <div>
                        <h1 class="tasks-title" id="mainTasksTitle">Minhas tarefas</h1>
                        <div id="contador" class="tasks-subtitle">
                            0 tarefas · 0 concluídas
                        </div>
                    </div>
                    <button class="btn-new" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="openNew()">
                        <i class="bi bi-plus-lg"></i> Nova tarefa
                    </button>
                </div>

                <!-- BARRA DE FILTROS -->
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <div class="filters d-flex gap-2">
                        <button class="btn btn-filter-active" id="f-todas" onclick="setFilter('todas')">
                            Todas
                        </button>
                        <button class="btn btn-filter-inactive" id="f-pendentes" onclick="setFilter('pendentes')">
                            Pendentes
                        </button>
                        <button class="btn btn-filter-inactive" id="f-concluidas" onclick="setFilter('concluidas')">
                            Concluídas
                        </button>
                    </div>

                    <!-- Indicador dinâmico de filtro de data -->
                    <div id="filtroDataContainer"></div>
                </div>

                <!-- LISTA DE TAREFAS -->
                <div class="task-card" id="taskContainer"></div>
            </div>
        </main>
    </div>

    <!-- MODAL DE CRIAÇÃO / EDIÇÃO DE TAREFA -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 id="modalTitle" class="modal-title">Nova tarefa</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="duas-colunas">
                        <div class="coluna-formulario">
                            <label class="field-label" for="inputTitulo">Tarefa</label>
                            <input id="inputTitulo" class="form-control mb-3" placeholder="Ex: Estudar capítulo 4" />
                            <label class="field-label" for="inputPrioridade">Prioridade</label>
                            <select id="inputPrioridade" class="form-select">
                                <option>Alta</option>
                                <option selected>Média</option>
                                <option>Baixa</option>
                            </select>
                            <div class="nota-modal">
                                <i class="bi bi-info-circle"></i> Sem dia marcado, a tarefa fica na lista sem agendamento.
                            </div>
                        </div>

                        <div class="coluna-calendario">
                            <div class="field-label">Dia</div>
                            <div class="mini-cal">
                                <div class="mini-cabecalho">
                                    <div>
                                        <div class="mini-titulo" id="miniTitulo">—</div>
                                        <div class="mini-leitura" id="textoData">Sem dia marcado</div>
                                    </div>
                                    <div class="d-flex gap-1">
                                        <button type="button" class="mini-nav" id="miniPrev" aria-label="Mês anterior">
                                            <i class="bi bi-chevron-left"></i>
                                        </button>
                                        <button type="button" class="mini-nav" id="miniNext" aria-label="Próximo mês">
                                            <i class="bi bi-chevron-right"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="mini-semana" id="miniDiasSemana"></div>
                                <div class="mini-grade" id="miniGrade"></div>
                                <div class="mini-atalhos">
                                    <button type="button" class="chip" data-atalho="hoje">Hoje</button>
                                    <button type="button" class="chip" data-atalho="amanha">Amanhã</button>
                                    <button type="button" class="chip" data-atalho="semana">+7 dias</button>
                                    <button type="button" class="chip chip-limpar" id="miniSemData">Nenhum</button>
                                </div>
                            </div>
                            <div class="mini-legenda">
                                <span><i class="bi bi-lock-fill"></i> passado bloqueado</span>
                                <span><span class="mini-marca-legenda"></span> dia ocupado</span>
                            </div>
                        </div>
                    </div>

                    <div class="erro" id="erroTarefa"></div>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn" data-bs-dismiss="modal" style="
                        background: #2a2f44;
                        color: var(--text);
                        border-radius: 10px;
                    ">
                        Cancelar
                    </button>
                    <button class="btn px-4" onclick="saveTask()" style="
                        background: var(--blue);
                        color: #0f111a;
                        font-weight: 600;
                        border-radius: 10px;
                    ">
                        Salvar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/datas.js"></script>
    <script src="script/minicalendario.js"></script>
    <script src="script/principal.js"></script>
</body>

</html>
