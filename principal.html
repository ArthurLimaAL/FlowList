<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minhas tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="principal.css">
</head>

<body>
    <div class="container-tasks">
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h2 class="fw-bold mb-1">Minhas tarefas</h2>
                <div id="contador" style="color: var(--muted); font-size: 14px">
                    0 tarefas · 0 concluídas
                </div>
            </div>
            <button class="btn-new" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="openNew()">
                <i class="bi bi-plus-lg"></i> Nova tarefa
            </button>
        </div>
        <div class="filters d-flex gap-2 mb-3">
            <button class="btn btn-filter-active" id="f-todas" onclick="setFilter('todas')">
                Todas
            </button>
            <button class="btn btn-filter-inactive" id="f-pendentes" onclick="setFilter('pendentes')">
                Pendentes
            </button>
            <button class="btn btn-filter-inactive" id="f-concluidas" onclick="setFilter('concluidas')">
                Concluídas
            </button>
        </div>
        <div class="task-card" id="taskContainer"></div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 id="modalTitle">Nova tarefa</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input id="inputTitulo" class="form-control mb-3" placeholder="Ex: Estudar capítulo 4" />
                    <select id="inputPrioridade" class="form-select">
                        <option>Alta</option>
                        <option selected>Média</option>
                        <option>Baixa</option>
                    </select>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn" data-bs-dismiss="modal" style="
                background: #2a2f44;
                color: var(--text);
                border-radius: 10px;
              ">
                        Cancelar
                    </button>
                    <button class="btn px-4" onclick="saveTask()" style="
                background: var(--blue);
                color: #0f111a;
                font-weight: 600;
                border-radius: 10px;
              ">
                        Salvar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let tasks = [],
            filter = 'todas',
            editingId = null
        function setFilter(f) {
            filter = f
            document
                .querySelectorAll('.filters .btn')
                .forEach((b) => (b.className = 'btn btn-filter-inactive'))
            document.getElementById('f-' + f).className = 'btn btn-filter-active'
            render()
        }
        function render() {
            document.getElementById('contador').textContent =
                `${tasks.length} ${tasks.length === 1 ? 'tarefa' : 'tarefas'} · ${tasks.filter((t) => t.done).length} concluídas`
            let list = tasks
            if (filter === 'pendentes') list = tasks.filter((t) => !t.done)
            if (filter === 'concluidas') list = tasks.filter((t) => t.done)
            const c = document.getElementById('taskContainer')
            if (!list.length) {
                c.innerHTML = `<div class="empty-state"><i class="bi bi-inbox"></i><div class="fw-semibold">Nenhuma tarefa por aqui</div><div style="color:var(--muted);font-size:14px">Clique em Nova tarefa para começar</div></div>`
                return
            }
            c.innerHTML = list
                .map(
                    (t) => `<div class="task-item">
    <button class="check-circle ${t.done ? 'done' : ''}" onclick="toggle(${t.id})">${t.done ? '<i class="bi bi-check-lg"></i>' : ''}</button>
    <div class="flex-grow-1"><div class="task-title ${t.done ? 'done' : ''}">${t.titulo}</div></div>
    <span class="badge-prio badge-${t.prioridade === 'Alta' ? 'alta' : t.prioridade === 'Média' ? 'media' : 'baixa'}">${t.prioridade}</span>
    <button class="icon-btn" onclick="openEdit(${t.id})"><i class="bi bi-pencil"></i></button>
    <button class="icon-btn" onclick="removeTask(${t.id})"><i class="bi bi-trash"></i></button>
  </div>`,
                )
                .join('')
        }
        function openNew() {
            editingId = null
            modalTitle.textContent = 'Nova tarefa'
            inputTitulo.value = ''
            inputPrioridade.value = 'Média'
        }
        function openEdit(id) {
            const t = tasks.find((x) => x.id === id)
            editingId = id
            modalTitle.textContent = 'Editar tarefa'
            inputTitulo.value = t.titulo
            inputPrioridade.value = t.prioridade
            new bootstrap.Modal(taskModal).show()
        }
        function saveTask() {
            const titulo = inputTitulo.value.trim()
            if (!titulo) return alert('Digite um título')
            const prioridade = inputPrioridade.value
            if (editingId !== null) {
                const t = tasks.find((x) => x.id === editingId)
                t.titulo = titulo
                t.prioridade = prioridade
            } else
                tasks.unshift({ id: Date.now(), titulo, prioridade, done: false })
            bootstrap.Modal.getInstance(taskModal).hide()
            render()
        }
        function toggle(id) {
            tasks.find((x) => x.id === id).done = !tasks.find((x) => x.id === id)
                .done
            render()
        }
        function removeTask(id) {
            if (!confirm('Excluir?')) return
            tasks = tasks.filter((x) => x.id !== id)
            render()
        }
        render()
    </script>
</body>

</html>
