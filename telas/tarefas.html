<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Minhas tarefas | Organiza</title>

    <!-- Carrega o Bootstrap. -->
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="container py-5">


        <h1 class="fw-bold">Minhas tarefas</h1>

        <p class="text-secondary">
            Organize suas atividades e acompanhe o que precisa fazer.
        </p>


        <section class="card border-0 shadow-sm rounded-4 p-4 mt-4">

            <h2 class="h5">Adicionar tarefa</h2>

            <label for="nomeTarefa" class="form-label mt-3">
                Nome da tarefa
            </label>

            <!-- Campo onde a pessoa digitará o nome da tarefa. -->
            <input type="text" id="nomeTarefa" class="form-control" placeholder="Ex.: Estudar banco de dados">

            <button type="button" id="btnAdicionar" class="btn btn-primary mt-3">
                Adicionar tarefa
            </button>


        </section>

        <!-- tarefas cadastradas serão exibidas. -->
        <section class="mt-4">


            <h2 class="h4">Minhas atividades</h2>

            <!-- Lista que receberá as tarefas pelo JavaScript. -->
            <ul id="listaTarefas" class="list-group mt-3">
            </ul>

        </section>


    </main>
     
    <script src="tarefas.js"></script>

</body>

</html>
